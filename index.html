<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>DAY100 GOAL</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<meta name="theme-color" content="#111318">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DAY100">
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<style>

:root{
  --bg:#FFFFFF; --sub:#F4F5F7; --line:#E5E7EB; --ink:#111318; --text2:#454B57; --muted:#6B7280;
  --accent:#2B59E0; --accentSoft:#EEF2FD; --cellOff:#E9EBEF; --cellOn:#111318;
  --primaryBg:#111318; --primaryFg:#FFFFFF; --noticeBg:#F1F4FE; --noticeInk:#2447B8;
  --segOn:#FFFFFF; --shadow:0 1px 2px rgba(17,19,24,.08); --danger:#C0362C; --dangerFg:#FFFFFF; --groupBar:#C7D4F7;
  --pop:0 12px 32px rgba(0,0,0,.14);
  --font:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B0C0F; --sub:#17191E; --line:#272A31; --ink:#F3F4F6; --text2:#C9CED6; --muted:#9AA1AD;
    --accent:#7FA0FF; --accentSoft:#1B2338; --cellOff:#22252C; --cellOn:#F3F4F6;
    --primaryBg:#F3F4F6; --primaryFg:#0B0C0F; --noticeBg:#151C2E; --noticeInk:#A9BEFF;
    --segOn:#2A2D35; --shadow:none; --danger:#FF8A80; --dangerFg:#0B0C0F; --groupBar:#2E3D66; --pop:0 12px 32px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#0B0C0F; --sub:#17191E; --line:#272A31; --ink:#F3F4F6; --text2:#C9CED6; --muted:#9AA1AD;
  --accent:#7FA0FF; --accentSoft:#1B2338; --cellOff:#22252C; --cellOn:#F3F4F6;
  --primaryBg:#F3F4F6; --primaryFg:#0B0C0F; --noticeBg:#151C2E; --noticeInk:#A9BEFF;
  --segOn:#2A2D35; --shadow:none; --danger:#FF8A80; --dangerFg:#0B0C0F; --groupBar:#2E3D66; --pop:0 12px 32px rgba(0,0,0,.5);
}
body::before{content:'';position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:45;pointer-events:none}
html{scroll-padding-top:env(safe-area-inset-top,0px);scrollbar-width:none;-ms-overflow-style:none;background:var(--bg)}
html::-webkit-scrollbar,body::-webkit-scrollbar{display:none;width:0;height:0}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow-wrap:anywhere;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:440px;margin:0 auto;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px));min-height:100vh}
@media (min-width:600px){.app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
.screen{display:flex;flex-direction:column;gap:24px}
.pad{padding-left:20px;padding-right:20px}
.row{display:flex;align-items:center}
.between{justify-content:space-between}
.col{display:flex;flex-direction:column}
.muted{color:var(--muted)}
.ib{width:44px;height:44px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border:0;border-radius:10px;background:transparent;padding:0;color:var(--ink)}
.ibs{width:36px;height:36px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border:0;border-radius:8px;background:transparent;padding:0;color:var(--ink)}
.ib:disabled,.ibs:disabled{opacity:.4;cursor:default}
.inp{width:100%;height:48px;padding:0 14px;border-radius:10px;border:1px solid transparent;background:var(--sub);color:var(--ink);font-size:16px;outline:none}
.inp:focus{border-color:var(--accent)}
.inp::placeholder{color:var(--muted);opacity:1}
.term{font-weight:600;font-size:17px}
.lbl{font-size:13px;font-weight:500;color:var(--text2)}
/* header */
.top{padding-top:12px}
.logo{display:flex;align-items:center;gap:7px}
.logo b{font-size:21px;font-weight:800;letter-spacing:-.03em;line-height:1;margin-left:-1px}
.logo i{font-style:normal;font-size:10px;font-weight:700;letter-spacing:.08em;line-height:1;padding:4px 6px;border-radius:5px;background:var(--accentSoft);color:var(--accent)}
.theme-btn{margin-right:-2.5px}
.count{display:flex;align-items:baseline;gap:6px}
.count b{font-size:40px;font-weight:700;letter-spacing:-.03em;line-height:1}
.count span{font-size:15px;font-weight:500;color:var(--muted)}
.pill{font-size:12px;font-weight:600;color:var(--accent);background:var(--accentSoft);padding:5px 10px;border-radius:999px}
.grid{display:grid;grid-template-columns:repeat(20,minmax(0,1fr));gap:4px}
.grid i{aspect-ratio:1;border-radius:3px;background:var(--cellOff)}
.grid i.on{background:var(--cellOn)}
.grid i.today{background:var(--accent)}
.stats{display:flex;align-items:baseline;gap:16px;font-size:13px;color:var(--muted)}
.stats b{font-size:15px;font-weight:700;color:var(--ink);margin-left:2px}
.warn{font-size:13px;color:var(--danger)}
.banner{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 10px 10px 14px;border-radius:12px;background:var(--noticeBg);color:var(--noticeInk);font-size:14px;font-weight:500}
.banner button{height:36px;padding:0 12px;border:0;border-radius:8px;background:var(--noticeInk);color:var(--bg);font-size:13px;font-weight:700;white-space:nowrap}
/* form */
.chipwrap{position:relative}
.chip{display:flex;align-items:center;gap:6px;height:34px;padding:0 10px 0 9px;border-radius:999px;border:1px solid transparent;background:var(--sub);color:var(--ink);font-size:13px;font-weight:600;white-space:nowrap}
.chip.open{border-color:var(--accent)}
.chip .ic{display:flex;color:var(--accent)}
.today-tag{font-size:10px;font-weight:700;line-height:1;padding:3px 5px;border-radius:4px;background:var(--accentSoft);color:var(--accent)}
.sec-title{font-size:17px;font-weight:700}
.wrow{display:flex;flex-direction:column;gap:8px;padding:14px 0 2px;border-top:1px solid var(--line)}
.rm{margin-right:-15px;color:var(--muted)}
.dup{display:flex;gap:10px;padding:12px 14px;border-radius:10px;background:var(--noticeBg)}
.dup .ic{color:var(--noticeInk);padding-top:1px;display:flex}
.dup b{font-size:14px;font-weight:600;color:var(--noticeInk)}
.dup span{font-size:13px;color:var(--text2)}
.toggle{align-self:flex-start;display:flex;align-items:center;gap:4px;height:36px;padding:0 6px;margin-left:-8.5px;border:0;border-radius:8px;background:transparent;color:var(--muted);font-size:13px;font-weight:500}
.addrow{height:48px;display:flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;border:1px dashed var(--line);background:transparent;color:var(--text2);font-size:15px;font-weight:500}
.primary{width:100%;height:54px;border:0;border-radius:14px;background:var(--primaryBg);color:var(--primaryFg);font-size:16px;font-weight:700}
.primary:disabled{opacity:.5;cursor:wait}
.err{font-size:14px;font-weight:500;color:var(--danger)}
/* picker */
.picker{position:absolute;top:40px;right:0;z-index:30;width:318px;max-width:calc(100vw - 32px);padding:12px;border-radius:16px;border:1px solid var(--line);background:var(--bg);box-shadow:var(--pop);display:flex;flex-direction:column;gap:4px}
.cal7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));text-align:center}
.wd{font-size:11px;color:var(--muted);padding:4px 0}
.pday{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:42px}
.pday button{width:34px;height:34px;border-radius:999px;border:0;padding:0;background:transparent;color:var(--ink);font-size:14px}
.pday button.t{color:var(--accent);font-weight:700}
.pday button.sel{background:var(--primaryBg);color:var(--primaryFg);font-weight:700}
.pday button:disabled{color:var(--line);cursor:default}
.pday i{width:4px;height:4px;border-radius:999px;background:transparent}
.pday i.has{background:var(--accent)}
.pfoot{display:flex;align-items:center;justify-content:space-between;padding:6px 2px 0 4px;border-top:1px solid var(--line)}
.pfoot span{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.pfoot span i{width:5px;height:5px;border-radius:999px;background:var(--accent)}
.pfoot button{height:36px;padding:0 12px;border:0;border-radius:8px;background:var(--accentSoft);color:var(--accent);font-size:13px;font-weight:700}
/* words */
.htitle{font-size:24px;font-weight:700;letter-spacing:-.02em}
.seg{display:grid;gap:4px;padding:3px;border-radius:10px;background:var(--sub)}
.seg button{height:36px;border:0;border-radius:8px;background:transparent;color:var(--muted);font-size:14px;font-weight:500}
.seg button.on{background:var(--segOn);color:var(--ink);box-shadow:var(--shadow);font-weight:600}
.search{display:flex;align-items:center;gap:8px;height:42px;padding:0 8px 0 12px;border-radius:10px;background:var(--sub);color:var(--muted)}
input[type=search]::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none}
.search input{flex:1;min-width:0;width:100%;border:0;background:transparent;color:var(--ink);font-size:15px;outline:none}
.blocks{display:flex;flex-direction:column;gap:28px}
.block{display:flex;flex-direction:column;gap:8px}
.btitle{color:var(--ink);text-decoration:none;font-size:16px;font-weight:700;line-height:1.4}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:3px}
.tag{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:6px;background:var(--sub);color:var(--text2);font-size:12px;font-weight:500}
.tag.blue{background:var(--accentSoft);color:var(--accent);font-weight:600}
.menuwrap{position:relative;flex-shrink:0;margin-right:-8px}
.menu{position:absolute;top:44px;right:4px;z-index:25;min-width:140px;display:flex;flex-direction:column;padding:4px;border-radius:12px;border:1px solid var(--line);background:var(--bg);box-shadow:var(--pop)}
.menu button{display:flex;align-items:center;gap:10px;height:44px;padding:0 12px;border:0;border-radius:8px;background:transparent;color:var(--ink);font-size:15px;text-align:left}
.menu button.del{color:var(--danger)}
.confirm{display:flex;flex-direction:column;gap:10px;padding:12px 14px;border-radius:10px;background:var(--sub)}
.confirm .btns{display:flex;gap:8px;justify-content:flex-end}
.btn2{height:40px;padding:0 14px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:14px;font-weight:500}
.btn2.danger{border:0;background:var(--danger);color:var(--dangerFg);font-weight:700}
.bar{display:flex;flex-direction:column;padding-left:14px;border-left:3px solid var(--groupBar)}
.w{display:flex;flex-direction:column;gap:2px;padding:10px 0}
.w + .w{border-top:1px solid var(--line)}
.wterm{font-size:17px;font-weight:600;letter-spacing:-.01em}
.nth{font-size:12px;font-weight:600;color:var(--accent);background:var(--accentSoft);padding:3px 8px;border-radius:999px;white-space:nowrap}
.wmean{font-size:15px;color:var(--text2)}
.wmemo{font-size:14px;color:var(--muted)}
.spk{margin-right:-8px}
.letter{font-size:22px;font-weight:700;color:var(--accent);padding-top:12px;padding-left:6px}
.aitem{display:flex;flex-direction:column;gap:2px;padding:12px 0 12px 6px}
.atoggle{display:flex;align-items:center;gap:8px;border:0;background:transparent;padding:0;color:var(--ink);min-height:36px;text-align:left}
.xn{font-size:12px;font-weight:700;color:var(--accent);background:var(--accentSoft);padding:3px 8px;border-radius:999px}
.src{display:flex;gap:8px;font-size:12px;color:var(--muted);margin-top:4px}
.src span:first-child{flex-shrink:0;white-space:nowrap}
.entries{display:flex;flex-direction:column;gap:12px;margin-top:10px;padding:14px;border-radius:12px;background:var(--sub)}
.entry{display:flex;flex-direction:column;gap:4px}
.entry + .entry{border-top:1px solid var(--line);padding-top:12px}
.calday{display:flex;align-items:center;justify-content:center;height:44px}
.calday button{width:36px;height:36px;border-radius:999px;border:0;padding:0;background:transparent;color:var(--muted);font-size:14px}
.calday button.has{background:var(--cellOn);color:var(--bg);font-weight:700}
.calday button.t:not(.has){background:var(--accentSoft);color:var(--accent);font-weight:700}
.calday button.sel{outline:3px solid var(--accent);outline-offset:1px}
.divider{height:1px;background:var(--line);margin:6px 0 12px}
.editor{display:flex;flex-direction:column;gap:12px;padding:14px;border-radius:14px;border:1.5px solid var(--ink)}
.empty{display:flex;flex-direction:column;align-items:center;gap:12px;padding:40px 32px 32px;text-align:center}
.empty .ico{width:64px;height:64px;border-radius:18px;background:var(--sub);color:var(--muted);display:flex;align-items:center;justify-content:center}
/* settings */
.sgroup{display:flex;flex-direction:column;gap:12px}
.slabel{font-size:17px;font-weight:700;letter-spacing:-.01em;color:var(--ink)}
.sgroup{padding-top:4px}
.sgroup + .sgroup{margin-top:4px;padding-top:24px;border-top:1px solid var(--line)}
.scard{display:flex;flex-direction:column;gap:14px;padding:16px;border-radius:14px;background:var(--sub)}
.scard .seg{background:var(--bg);width:190px;grid-template-columns:repeat(2,minmax(0,1fr))}
.outline{display:flex;align-items:center;justify-content:center;gap:6px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:14px;font-weight:500}
/* tab bar */
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;z-index:40;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));padding:6px 8px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--bg)}
.tabbar button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:54px;border:0;background:transparent;color:var(--muted);font-weight:500}
.tabbar button span{font-size:12px}
.tabbar button[aria-current="page"]{color:var(--ink);font-weight:700}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:50;max-width:calc(100% - 40px);padding:12px 18px;border-radius:12px;background:var(--primaryBg);color:var(--primaryFg);font-size:14px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.18);pointer-events:none;opacity:0;transition:opacity .2s}
.toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.modalback{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;padding:24px}
.modalcard{width:100%;max-width:340px;display:flex;flex-direction:column;gap:12px;padding:20px;border-radius:16px;background:var(--bg);box-shadow:var(--pop)}
.authwrap{min-height:100vh;min-height:100dvh;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:28px;padding:32px 24px}
.authlogo{display:flex;flex-direction:column;align-items:center;gap:10px}
.authlogo .logo{display:flex;align-items:center;gap:8px}
.authlogo .logo b{font-size:30px;font-weight:800;letter-spacing:-.03em}
.authlogo .logo i{font-style:normal;font-size:12px;font-weight:700;letter-spacing:.08em;padding:5px 8px;border-radius:6px;background:var(--accentSoft);color:var(--accent)}
.authlogo span{font-size:13px;color:var(--muted)}
.authcard{width:100%;max-width:340px;display:flex;flex-direction:column;gap:14px}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;height:50px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:15px;font-weight:600}
.divider{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--line)}
.authtabs{display:flex;gap:4px;padding:3px;border-radius:10px;background:var(--sub)}
.authtabs button{flex:1;height:38px;border:0;border-radius:8px;background:transparent;color:var(--muted);font-size:14px;font-weight:500}
.authtabs button.on{background:var(--segOn);color:var(--ink);font-weight:700;box-shadow:var(--shadow)}

</style>
</head>
<body>
<div class="app" id="app">
<div class="screen" id="auth-screen" style="display:none"></div>
<div class="screen" id="screen"></div>
</div>
<nav class="tabbar" aria-label="화면 이동" id="tabbar" style="display:none">
  <button type="button" data-a="tab" data-v="record" id="t-record"></button>
  <button type="button" data-a="tab" data-v="words" id="t-words"></button>
  <button type="button" data-a="tab" data-v="settings" id="t-settings"></button>
</nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';
/* ---------- utils ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => (n < 10 ? '0' : '') + n;
const dstr = off => { const d = new Date(); d.setDate(d.getDate() + (off || 0)); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
const today = () => dstr(0);
const kor = d => { if (!d) return ''; const p = d.split('-'); return Number(p[1]) + '월 ' + Number(p[2]) + '일'; };
const md = d => { if (!d) return ''; const p = d.split('-'); return Number(p[1]) + '/' + Number(p[2]); };
const nkey = s => String(s || '').toLowerCase().trim().replace(/\s+/g, ' ');
let uidN = 0; const uid = () => Date.now().toString(36) + (++uidN).toString(36) + Math.random().toString(36).slice(2, 6);
const safeUrl = u => /^https?:\/\//i.test(u || '') ? u : '';
const ICONS = {
  moon:'<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  speaker:'<path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/>',
  download:'<path d="M12 4v11"/><path d="M7 10l5 5 5-5"/><path d="M5 20h14"/>',
  x:'<path d="M6 6l12 12M18 6L6 18"/>', plus:'<path d="M12 5v14M5 12h14"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>',
  repeat:'<path d="M17 2l3 3-3 3"/><path d="M4 11V9a4 4 0 0 1 4-4h12"/><path d="M7 22l-3-3 3-3"/><path d="M20 13v2a4 4 0 0 1-4 4H4"/>',
  chevUp:'<path d="M6 15l6-6 6 6"/>', chevDown:'<path d="M6 9l6 6 6-6"/>', chevLeft:'<path d="M15 6l-6 6 6 6"/>', chevRight:'<path d="M9 6l6 6-6 6"/>',
  edit:'<path d="M4 20h4L19 9l-4-4L4 16v4z"/>', trash:'<path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"/>',
  book:'<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2V5z"/><path d="M4 19a2 2 0 0 1 2-2h13"/><path d="M9 8h6"/>',

async function importBackup(file) {
  S.importing = true; render();
  try {
    const text = await file.text();
    const data = JSON.parse(text);
    const list = Array.isArray(data.sessions) ? data.sessions : [];
    let added = 0;
    for (const raw of list) {
      const s = norm(raw); if (!s.id) continue;
      const ref = userCol().doc(s.id);
      const snap = await ref.get();
      if (snap.exists) continue;
      const { id, ...body } = s; body.schemaVersion = 1;
      await ref.set(body); added++;
    }
    S.importing = false; render();
    toast(added ? '기록 ' + added + '개를 가져왔어요' : '새로 가져올 기록이 없어요');
  } catch (e) {
    S.importing = false; render();
    toast('가져오지 못했어요. 파일을 확인해 주세요');
  }
}

const speechOK = typeof window.speechSynthesis !== 'undefined' && typeof window.SpeechSynthesisUtterance !== 'undefined';
function speak(text) {
  if (!speechOK || !text) return;
  try {
    const ss = window.speechSynthesis; ss.cancel();
    const u = new SpeechSynthesisUtterance(text);
    const lang = prefs.accent === 'UK' ? 'en-GB' : 'en-US';
    u.lang = lang; u.rate = prefs.slow ? 0.7 : 1;
    const vs = ss.getVoices() || [];
    const nl = v => String(v.lang || '').replace('_', '-').toLowerCase();
    const v = vs.find(x => nl(x) === lang.toLowerCase()) || vs.find(x => nl(x).indexOf('en') === 0);
    if (v) u.voice = v;
    ss.speak(u);
  } catch (e) {}
}

/* ---------- derived ---------- */
function derive() {
  const T = today();
  const dates = {}; let total = 0, todayW = 0;
  S.sessions.forEach(s => { dates[s.date] = true; total += s.words.length; if (s.date === T) todayW += s.words.length; });
  const chron = S.sessions.slice().sort((a, b) => a.date.localeCompare(b.date) || (a.createdAt || 0) - (b.createdAt || 0));
  const seen = {}, nthOf = {}, byKey = {};
  chron.forEach(s => s.words.forEach(w => {
    const k = nkey(w.term); if (!k) return;
    seen[k] = (seen[k] || 0) + 1; nthOf[w.id] = seen[k];
    (byKey[k] = byKey[k] || []).push({ w, s });
  }));
  return { T, dates, count: Object.keys(dates).length, total, todayW, nthOf, byKey };
}

  if (S.saving) return;
  const f = S.form;
  const title = f.title.trim(), url = f.url.trim();
  if (!title) { S.err = '콘텐츠 제목을 적어 주세요'; render(); const t = $('#f-title'); if (t) t.focus(); return; }
  if (url && !safeUrl(url)) { S.err = '링크는 https:// 로 시작해야 해요'; render(); const u = $('#f-url'); if (u) u.focus(); return; }
  const words = wordsFrom(f.rows);
  const s = { id: uid(), date: f.date || today(), title, url, words, createdAt: Date.now() };
  S.saving = true; S.err = ''; render();
  try {
    await store.save(s);
    if (store.kind === 'db' && !S.sessions.some(x => x.id === s.id)) S.sessions.push(s);
    S.form = blankForm(); S.picker = null; S.saving = false; render(); window.scrollTo(0, 0);
    toast('저장했어요 · 단어 ' + words.length + '개');
  } catch (e) {
    S.saving = false; S.err = '저장하지 못했어요. 잠시 뒤 다시 눌러 주세요.'; render();
  }
}
async function saveEdit() {
  const f = S.inlineForm, id = S.inlineId; if (!f) return;
  const title = f.title.trim(), url = f.url.trim();
  if (!title) { S.inlineErr = '콘텐츠 제목을 적어 주세요'; renderList(); return; }
  if (url && !safeUrl(url)) { S.inlineErr = '링크는 https:// 로 시작해야 해요'; renderList(); return; }
  const prev = S.sessions.find(x => x.id === id); if (!prev) return;
  const s = { id, date: f.date || prev.date, title, url, words: wordsFrom(f.rows), createdAt: prev.createdAt || Date.now() };
  try {
    await store.save(s);
    const i = S.sessions.findIndex(x => x.id === id); if (i >= 0) S.sessions[i] = s;
    S.inlineId = null; S.inlineForm = null; S.inlineErr = ''; S.picker = null; renderList(); toast('수정했어요'); scrollToBlock(id);
  } catch (e) { S.inlineErr = '저장하지 못했어요. 잠시 뒤 다시 눌러 주세요.'; renderList(); }
}
async function delSession(id) {
  try { await store.remove(id); S.sessions = S.sessions.filter(x => x.id !== id); S.confirmDel = null; render(); toast('기록을 지웠어요'); }
  catch (e) { toast('지우지 못했어요. 잠시 뒤 다시 시도해 주세요.'); }
}
async function backup() {
  const list = S.sessions.slice().sort((a, b) => a.date.localeCompare(b.date) || (a.createdAt || 0) - (b.createdAt || 0));
  const data = { app: 'DAY100 GOAL', schemaVersion: 1, exportedAt: new Date().toISOString(), sessionCount: list.length, wordCount: list.reduce((a, s) => a + s.words.length, 0), sessions: list };
  const json = JSON.stringify(data, null, 2);
  try {
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'day100-backup-' + today() + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    toast('백업 파일을 저장했어요 · 기록 ' + data.sessionCount + '개');
  } catch (e) { toast('백업 파일을 만들지 못했어요'); }
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  // 바깥을 누르면 달력·메뉴 닫기
  if (S.picker && !e.target.closest('[data-keep="picker"]') && !(el && (el.dataset.a === 'picker' || el.dataset.a === 'pick' || el.dataset.a === 'pkMonth'))) {
    S.picker = null; S.pickerMonth = null;
    if (!el) { document.querySelectorAll('.picker').forEach(x => x.remove()); document.querySelectorAll('.chip.open').forEach(x => { x.classList.remove('open'); x.setAttribute('aria-expanded', 'false'); }); return; }
  }
  if (S.menuId && !e.target.closest('[data-keep="menu"]')) {
    S.menuId = null;
    if (!el) { document.querySelectorAll('.menu').forEach(x => x.remove()); return; }
  }
  if (S.sortOpen && !e.target.closest('[data-keep="sort"]')) {
    S.sortOpen = false; render();
    if (!el) return;
  }
  if (!el) return;
  const a = el.dataset.a, v = el.dataset.v, ctx = el.dataset.ctx, rid = el.dataset.row, id = el.dataset.id;
  switch (a) {
    case 'tab': S.tab = v; S.picker = null; S.menuId = null; render(); window.scrollTo(0, 0); break;
    case 'theme': prefs.theme = prefs.theme === 'dark' ? 'light' : 'dark'; savePrefs(); applyTheme(); render(); break;
    case 'setTheme': prefs.theme = v; savePrefs(); applyTheme(); render(); break;
    case 'accent': prefs.accent = v; savePrefs(); render(); break;
    case 'slow': prefs.slow = v === '1'; savePrefs(); render(); break;
    case 'say': speak(v); break;
    case 'backup': backup(); break;
    case 'authGoogle': authGoogle(); break;
    case 'authTab': S.authMode = v; S.authErr = ''; renderAuth(); break;
    case 'authSubmit': authEmailSubmit(); break;
    case 'signout': authSignOut(); break;
    case 'voiceInfo': S.voiceInfoOpen = true; render(); break;
    case 'closeVoiceInfo': S.voiceInfoOpen = false; render(); break;
    case 'picker': S.picker = S.picker === ctx ? null : ctx; S.pickerMonth = null; S.menuId = null; rerender(ctx); break;
    case 'pkMonth': { const f = formOf(S.picker); const base = S.pickerMonth || ((f && f.date) || today()).slice(0, 7); let y = +base.slice(0, 4), m = +base.slice(5, 7) + Number(v); if (m < 1) { m = 12; y--; } if (m > 12) { m = 1; y++; } S.pickerMonth = y + '-' + pad(m); rerender(S.picker); break; }
    case 'pick': { if (v > today()) break; const f = formOf(ctx); if (f) f.date = v; S.picker = null; S.pickerMonth = null; rerender(ctx); break; }
    case 'addRow': { const f = formOf(ctx); const r = newRow(); f.rows.push(r); rerender(ctx); focusRow(ctx, r.id); break; }
    case 'rmRow': { const f = formOf(ctx); f.rows = f.rows.filter(r => r.id !== rid); if (!f.rows.length) f.rows.push(newRow()); rerender(ctx); break; }
    case 'toggleMemo': { const f = formOf(ctx); const r = f.rows.find(x => x.id === rid); if (r) r.open = !r.open; rerender(ctx); break; }
    case 'speakRow': { const r = formOf(ctx).rows.find(x => x.id === rid); if (r) speak(r.term); break; }
    case 'speakMemo': { const r = formOf(ctx).rows.find(x => x.id === rid); if (r) speak(r.memo); break; }
    case 'save': saveNew(); break;
    case 'mode': S.mode = v; S.menuId = null; render(); break;
    case 'menu': S.menuId = S.menuId === id ? null : id; renderList(); break;
    case 'edit': { const s = S.sessions.find(x => x.id === id); if (!s) break; S.menuId = null; S.confirmDel = null; S.picker = null;
      const rows = s.words.map(w => ({ id: w.id, term: w.term, meaning: w.meaning, memo: w.memo, open: !!w.memo }));
      S.inlineId = id; S.inlineForm = { date: s.date, title: s.title, url: s.url, rows: rows.length ? rows : [newRow()] }; S.inlineErr = ''; renderList(); break; }
    case 'cancelEdit': { const eid = S.inlineId; S.inlineId = null; S.inlineForm = null; S.inlineErr = ''; S.picker = null; renderList(); scrollToBlock(eid); break; }
    case 'saveEdit': saveEdit(); break;
    case 'askDel': S.menuId = null; S.confirmDel = id; S.inlineId = null; S.inlineForm = null; renderList(); break;
    case 'cancelDel': S.confirmDel = null; renderList(); break;
    case 'del': delSession(id); break;
    case 'openKey': S.openKeys[v] = !S.openKeys[v]; renderList(); break;
    case 'calMonth': { const all = Object.keys(D.dates).sort(); const base = S.calMonth || (all.length ? all[all.length - 1] : today()).slice(0, 7); let y = +base.slice(0, 4), m = +base.slice(5, 7) + Number(v); if (m < 1) { m = 12; y--; } if (m > 12) { m = 1; y++; } S.calMonth = y + '-' + pad(m); S.menuId = null; renderList(); break; }
    case 'calPick': S.calSel = v; S.menuId = null; renderList(); break;
    case 'toggleSort': S.sortOpen = !S.sortOpen; render(); break;
    case 'reshuffle': S.abcShuffle = true; S.shuffleSeed = Math.floor(Math.random() * 1e9) + 1; render(); break;
    case 'exitShuffle': S.abcShuffle = false; render(); break;
    case 'setSort': S.sortBy = v; S.sortOpen = false; render(); break;
    case 'clearSearch': {
      S.q = ''; renderList();
      const qi = document.querySelector('input[data-f="q"]'); if (qi) { qi.value = ''; qi.focus(); }
      const cb = document.getElementById('searchClear'); if (cb) cb.style.display = 'none';
      break;
    }
  }
});

let dupTimers = {};
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'import-file') { if (t.files && t.files[0]) importBackup(t.files[0]); t.value = ''; return; }
  const af = t.dataset.af;
  if (af === 'email') { S.authEmail = t.value; return; }
  if (af === 'pw') { S.authPw = t.value; return; }
  const f = t.dataset.f; if (!f) return;
  if (f === 'q') { S.q = t.value; renderList(); const cb = document.getElementById('searchClear'); if (cb) cb.style.display = S.q ? 'flex' : 'none'; return; }
  const ctx = t.dataset.ctx, form = formOf(ctx); if (!form) return;
  if (f === 'title' || f === 'url') { form[f] = t.value; if (ctx === 'f' && S.err) { S.err = ''; } return; }
  const r = form.rows.find(x => x.id === t.dataset.row); if (!r) return;
  r[f] = t.value;
  if (f === 'term') {
    const b = document.getElementById('spk-' + ctx + '-' + r.id); if (b) b.disabled = !r.term.trim();
    clearTimeout(dupTimers[r.id]);
    dupTimers[r.id] = setTimeout(() => { const box = document.getElementById('dup-' + ctx + '-' + r.id); if (box) box.outerHTML = dupHTML(r, ctx, ctx === 'i' ? S.inlineId : null); }, 250);
  }
  if (f === 'memo') {
    const mb = document.getElementById('memospk-' + ctx + '-' + r.id);
    if (mb) { const has = !!r.memo.trim(); mb.disabled = !has; mb.style.color = has ? 'var(--ink)' : 'var(--muted)'; }
  }
});
document.addEventListener('keydown', e => {
  const t = e.target;
  if (e.key === 'Enter' && t.dataset && t.dataset.af === 'pw' && !S.authBusy) { e.preventDefault(); authEmailSubmit(); return; }
  if (e.key === 'Enter' && t.dataset && t.dataset.f === 'meaning' && !e.isComposing && e.keyCode !== 229) {
    e.preventDefault(); const ctx = t.dataset.ctx, form = formOf(ctx); const r = newRow(); form.rows.push(r); rerender(ctx); focusRow(ctx, r.id);
  }
  if (e.key === 'Escape' && (S.picker || S.menuId || S.voiceInfoOpen || S.sortOpen)) { S.picker = null; S.menuId = null; S.voiceInfoOpen = false; S.sortOpen = false; render(); }
});

document.addEventListener('gesturestart', e => e.preventDefault());
let lastTouchEnd = 0;
document.addEventListener('touchend', e => { const now = Date.now(); if (now - lastTouchEnd <= 300) e.preventDefault(); lastTouchEnd = now; }, { passive: false });

try { history.scrollRestoration = 'manual'; } catch (e) {}
let scrollLockUntil = 0, userActed = false;
['touchstart', 'wheel', 'mousedown', 'keydown'].forEach(ev => document.addEventListener(ev, () => { userActed = true; }, { passive: true, capture: true }));
window.addEventListener('scroll', () => { if (!userActed && Date.now() < scrollLockUntil && window.scrollY > 0) window.scrollTo(0, 0); }, { passive: true });

render();
auth.onAuthStateChanged(u => {
  if (u) { S.user = u; S.authBusy = false; S.authErr = ''; S.tab = 'record'; S.mode = 'video'; S.q = ''; S.sortBy = 'latest'; S.sortOpen = false; S.abcShuffle = false; S.openKeys = {}; S.calSel = null; S.calMonth = null; S.menuId = null; S.confirmDel = null; S.inlineId = null; S.inlineForm = null; S.picker = null; if (document.activeElement && document.activeElement.blur) document.activeElement.blur(); connectUser(); }
  else { S.user = null; disconnectUser(); S.authBusy = false; S.authErr = ''; S.authMode = 'signin'; }
  render();
  resetScroll();
});

/* 로그인·로그아웃으로 화면이 바뀌면 맨 위에서 시작. 직후 2초간은 사용자가 직접 만지기 전까지 밀려 내려가도 다시 맨 위로 */
function resetScroll() {
  userActed = false; scrollLockUntil = Date.now() + 2000;
  const go = () => { if (userActed) return; window.scrollTo(0, 0); document.documentElement.scrollTop = 0; document.body.scrollTop = 0; };
  go(); requestAnimationFrame(go); setTimeout(go, 200);
}
})();
</script>
