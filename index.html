<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>DAY100 GOAL</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<meta name="theme-color" content="#111318">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DAY100">
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<style>

:root{
  --bg:#FFFFFF; --sub:#F4F5F7; --line:#E5E7EB; --ink:#111318; --text2:#454B57; --muted:#6B7280;
  --accent:#2B59E0; --accentSoft:#EEF2FD; --cellOff:#E9EBEF; --cellOn:#111318;
  --primaryBg:#111318; --primaryFg:#FFFFFF; --noticeBg:#F1F4FE; --noticeInk:#2447B8;
  --segOn:#FFFFFF; --shadow:0 1px 2px rgba(17,19,24,.08); --danger:#C0362C; --dangerFg:#FFFFFF; --groupBar:#C7D4F7;
  --pop:0 12px 32px rgba(0,0,0,.14);
  --font:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B0C0F; --sub:#17191E; --line:#272A31; --ink:#F3F4F6; --text2:#C9CED6; --muted:#9AA1AD;
    --accent:#7FA0FF; --accentSoft:#1B2338; --cellOff:#22252C; --cellOn:#F3F4F6;
    --primaryBg:#F3F4F6; --primaryFg:#0B0C0F; --noticeBg:#151C2E; --noticeInk:#A9BEFF;
    --segOn:#2A2D35; --shadow:none; --danger:#FF8A80; --dangerFg:#0B0C0F; --groupBar:#2E3D66; --pop:0 12px 32px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#0B0C0F; --sub:#17191E; --line:#272A31; --ink:#F3F4F6; --text2:#C9CED6; --muted:#9AA1AD;
  --accent:#7FA0FF; --accentSoft:#1B2338; --cellOff:#22252C; --cellOn:#F3F4F6;
  --primaryBg:#F3F4F6; --primaryFg:#0B0C0F; --noticeBg:#151C2E; --noticeInk:#A9BEFF;
  --segOn:#2A2D35; --shadow:none; --danger:#FF8A80; --dangerFg:#0B0C0F; --groupBar:#2E3D66; --pop:0 12px 32px rgba(0,0,0,.5);
}
body::before{content:'';position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:45;pointer-events:none}
html{scroll-padding-top:env(safe-area-inset-top,0px);scrollbar-width:none;-ms-overflow-style:none;background:var(--bg)}
html::-webkit-scrollbar,body::-webkit-scrollbar{display:none;width:0;height:0}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow-wrap:anywhere;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:440px;margin:0 auto;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px));min-height:100vh}
@media (min-width:600px){.app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
.app.in{padding-bottom:96px}
.screen{display:flex;flex-direction:column;gap:24px}
.pad{padding-left:20px;padding-right:20px}
.row{display:flex;align-items:center}
.between{justify-content:space-between}
.col{display:flex;flex-direction:column}
.muted{color:var(--muted)}
.ib{width:44px;height:44px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border:0;border-radius:10px;background:transparent;padding:0;color:var(--ink)}
.ibs{width:36px;height:36px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border:0;border-radius:8px;background:transparent;padding:0;color:var(--ink)}
.ib:disabled,.ibs:disabled{opacity:.4;cursor:default}
.inp{width:100%;height:48px;padding:0 14px;border-radius:10px;border:1px solid transparent;background:var(--sub);color:var(--ink);font-size:16px;outline:none}
.inp:focus{border-color:var(--accent)}
.inp::placeholder{color:var(--muted);opacity:1}
.term{font-weight:600;font-size:16px}
.term::placeholder{font-weight:400}
.lbl{font-size:13px;font-weight:500;color:var(--text2)}
/* header */
.top{padding-top:12px}
.logo{display:flex;align-items:center;gap:7px}
.logo b{font-size:21px;font-weight:800;letter-spacing:-.03em;line-height:1;margin-left:-1px}
.logo i{font-style:normal;font-size:10px;font-weight:700;letter-spacing:.08em;line-height:1;padding:4px 6px;border-radius:5px;background:var(--accentSoft);color:var(--accent)}
.theme-btn{margin-right:-2.5px}
.count{display:flex;align-items:baseline;gap:6px}
.count b{font-size:40px;font-weight:700;letter-spacing:-.03em;line-height:1}
.count span{font-size:15px;font-weight:500;color:var(--muted)}
.pill{font-size:12px;font-weight:600;color:var(--accent);background:var(--accentSoft);padding:5px 10px;border-radius:999px}
.grid{display:grid;grid-template-columns:repeat(20,minmax(0,1fr));gap:4px}
.grid i{aspect-ratio:1;border-radius:3px;background:var(--cellOff)}
.grid i.on{background:var(--cellOn)}
.grid i.today{background:var(--accent)}
.stats{display:flex;align-items:baseline;gap:16px;font-size:13px;color:var(--muted)}
.stats b{font-size:15px;font-weight:700;color:var(--ink);margin-left:2px}
.warn{font-size:13px;color:var(--danger)}
.banner{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 10px 10px 14px;border-radius:12px;background:var(--noticeBg);color:var(--noticeInk);font-size:14px;font-weight:500}
.banner button{height:36px;padding:0 12px;border:0;border-radius:8px;background:var(--noticeInk);color:var(--bg);font-size:13px;font-weight:700;white-space:nowrap}
/* form */
.chipwrap{position:relative}
.chip{display:flex;align-items:center;gap:6px;height:34px;padding:0 10px 0 9px;border-radius:999px;border:1px solid transparent;background:var(--sub);color:var(--ink);font-size:13px;font-weight:600;white-space:nowrap}
.chip.open{border-color:var(--accent)}
.chip .ic{display:flex;color:var(--accent)}
.today-tag{font-size:10px;font-weight:700;line-height:1;padding:3px 5px;border-radius:4px;background:var(--accentSoft);color:var(--accent)}
.sec-title{font-size:17px;font-weight:700}
.wrow{display:flex;flex-direction:column;gap:8px;padding:14px 0 2px;border-top:1px solid var(--line)}
.rm{margin-right:-15px;color:var(--muted)}
.dup{display:flex;gap:10px;padding:12px 14px;border-radius:10px;background:var(--noticeBg)}
.dup .ic{color:var(--noticeInk);padding-top:1px;display:flex}
.dup b{font-size:14px;font-weight:600;color:var(--noticeInk)}
.dup span{font-size:13px;color:var(--text2)}
.toggle{align-self:flex-start;display:flex;align-items:center;gap:4px;height:36px;padding:0 6px;margin-left:-8.5px;border:0;border-radius:8px;background:transparent;color:var(--muted);font-size:13px;font-weight:500}
.addrow{height:48px;display:flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;border:1px dashed var(--line);background:transparent;color:var(--text2);font-size:15px;font-weight:500}
.primary{width:100%;height:54px;border:0;border-radius:14px;background:var(--primaryBg);color:var(--primaryFg);font-size:16px;font-weight:700}
.primary:disabled{opacity:.5;cursor:wait}
.err{font-size:14px;font-weight:500;color:var(--danger)}
/* picker */
.picker{position:absolute;top:40px;right:0;z-index:30;width:318px;max-width:calc(100vw - 32px);padding:12px;border-radius:16px;border:1px solid var(--line);background:var(--bg);box-shadow:var(--pop);display:flex;flex-direction:column;gap:4px}
.cal7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));text-align:center}
.wd{font-size:11px;color:var(--muted);padding:4px 0}
.pday{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:42px}
.pday button{width:34px;height:34px;border-radius:999px;border:0;padding:0;background:transparent;color:var(--ink);font-size:14px}
.pday button.t{color:var(--accent);font-weight:700}
.pday button.sel{background:var(--primaryBg);color:var(--primaryFg);font-weight:700}
.pday button:disabled{color:var(--line);cursor:default}
.pday i{width:4px;height:4px;border-radius:999px;background:transparent}
.pday i.has{background:var(--accent)}
.pfoot{display:flex;align-items:center;justify-content:space-between;padding:6px 2px 0 4px;border-top:1px solid var(--line)}
.pfoot span{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.pfoot span i{width:5px;height:5px;border-radius:999px;background:var(--accent)}
.pfoot button{height:36px;padding:0 12px;border:0;border-radius:8px;background:var(--accentSoft);color:var(--accent);font-size:13px;font-weight:700}
/* words */
.htitle{font-size:24px;font-weight:700;letter-spacing:-.02em}
.seg{display:grid;gap:4px;padding:3px;border-radius:10px;background:var(--sub)}
.seg button{height:36px;border:0;border-radius:8px;background:transparent;color:var(--muted);font-size:14px;font-weight:500}
.seg button.on{background:var(--segOn);color:var(--ink);box-shadow:var(--shadow);font-weight:600}
.search{display:flex;align-items:center;gap:8px;height:42px;padding:0 8px 0 12px;border-radius:10px;background:var(--sub);color:var(--muted)}
input[type=search]::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none}
.search input{flex:1;min-width:0;width:100%;border:0;background:transparent;color:var(--ink);font-size:15px;outline:none}
.blocks{display:flex;flex-direction:column;gap:28px}
.block{display:flex;flex-direction:column;gap:8px}
.btitle{color:var(--ink);text-decoration:none;font-size:16px;font-weight:700;line-height:1.4}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:3px}
.tag{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:6px;background:var(--sub);color:var(--text2);font-size:12px;font-weight:500}
.tag.blue{background:var(--accentSoft);color:var(--accent);font-weight:600}
.menuwrap{position:relative;flex-shrink:0;margin-right:-8px}
.menu{position:absolute;top:44px;right:4px;z-index:25;min-width:140px;display:flex;flex-direction:column;padding:4px;border-radius:12px;border:1px solid var(--line);background:var(--bg);box-shadow:var(--pop)}
.menu button{display:flex;align-items:center;gap:10px;height:44px;padding:0 12px;border:0;border-radius:8px;background:transparent;color:var(--ink);font-size:15px;text-align:left}
.menu button.del{color:var(--danger)}
.confirm{display:flex;flex-direction:column;gap:4px;padding:14px 16px 16px;border-radius:10px;background:var(--sub)}
.confirm > span{word-break:keep-all}
.confirm .btns{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px;align-self:flex-end}
.confirm .btn2{min-width:56px}
.btn2{height:40px;padding:0 14px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:14px;font-weight:500}
.btn2.danger{border:0;background:var(--danger);color:var(--dangerFg);font-weight:700}
.bar{display:flex;flex-direction:column;padding-left:14px;border-left:3px solid var(--groupBar)}
.w{display:flex;flex-direction:column;gap:2px;padding:10px 0}
.w + .w{border-top:1px solid var(--line)}
.wterm{font-size:17px;font-weight:600;letter-spacing:-.01em}
.nth{font-size:12px;font-weight:600;color:var(--accent);background:var(--accentSoft);padding:3px 8px;border-radius:999px;white-space:nowrap}
.wmean{font-size:15px;color:var(--text2)}
.wmemo{font-size:14px;color:var(--muted)}
.spk{margin-right:-8px}
.letter{font-size:22px;font-weight:700;color:var(--accent);padding-top:12px;padding-left:6px}
.aitem{display:flex;flex-direction:column;gap:2px;padding:12px 0 12px 6px}
.atoggle{display:flex;align-items:center;gap:8px;border:0;background:transparent;padding:0;color:var(--ink);min-height:36px;text-align:left}
.xn{font-size:12px;font-weight:700;color:var(--accent);background:var(--accentSoft);padding:3px 8px;border-radius:999px}
.src{display:flex;gap:8px;font-size:12px;color:var(--muted);margin-top:4px}
.src span:first-child{flex-shrink:0;white-space:nowrap}
.entries{display:flex;flex-direction:column;gap:12px;margin-top:10px;padding:14px;border-radius:12px;background:var(--sub)}
.entry{display:flex;flex-direction:column;gap:4px}
.entry + .entry{border-top:1px solid var(--line);padding-top:12px}
.calday{display:flex;align-items:center;justify-content:center;height:44px}
.calday button{width:36px;height:36px;border-radius:999px;border:0;padding:0;background:transparent;color:var(--muted);font-size:14px}
.calday button.has{background:var(--cellOn);color:var(--bg);font-weight:700}
.calday button.t:not(.has){background:var(--accentSoft);color:var(--accent);font-weight:700}
.calday button.sel{outline:3px solid var(--accent);outline-offset:1px}
.divider{height:1px;background:var(--line);margin:6px 0 12px}
.editor{display:flex;flex-direction:column;gap:12px;padding:14px;border-radius:14px;border:1.5px solid var(--ink)}
.empty{display:flex;flex-direction:column;align-items:center;gap:12px;padding:40px 32px 32px;text-align:center}
.empty .ico{width:64px;height:64px;border-radius:18px;background:var(--sub);color:var(--muted);display:flex;align-items:center;justify-content:center}
/* settings */
.sgroup{display:flex;flex-direction:column;gap:12px}
.slabel{font-size:17px;font-weight:700;letter-spacing:-.01em;color:var(--ink)}
.sgroup{padding-top:4px}
.sgroup + .sgroup{margin-top:0;padding-top:20px;border-top:1px solid var(--line)}
.scard{display:flex;flex-direction:column;gap:14px;padding:16px;border-radius:14px;background:var(--sub)}
.scard .seg{background:var(--bg);width:190px;grid-template-columns:repeat(2,minmax(0,1fr))}
.outline{display:flex;align-items:center;justify-content:center;gap:6px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:14px;font-weight:500}
/* tab bar */
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;z-index:40;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));padding:6px 8px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--bg)}
.tabbar button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:54px;border:0;background:transparent;color:var(--muted);font-weight:500}
.tabbar button span{font-size:12px}
.tabbar button[aria-current="page"]{color:var(--ink);font-weight:700}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:50;width:max-content;max-width:calc(100% - 40px);box-sizing:border-box;text-align:center;white-space:pre-line;word-break:keep-all;overflow-wrap:break-word;padding:12px 18px;border-radius:12px;background:var(--primaryBg);color:var(--primaryFg);font-size:14px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.18);pointer-events:none;opacity:0;transition:opacity .2s}
.toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}
.spkwave .wb{transform-box:fill-box;transform-origin:center;animation:spkwv .9s ease-in-out infinite}
.spkwave .wb:nth-child(2){animation-delay:-.6s}.spkwave .wb:nth-child(3){animation-delay:-.3s}.spkwave .wb:nth-child(4){animation-delay:-.75s}.spkwave .wb:nth-child(5){animation-delay:-.15s}
@keyframes spkwv{0%,100%{transform:scaleY(.5)}50%{transform:scaleY(1)}}
@media (prefers-reduced-motion: reduce){.spkwave .wb{animation:none}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.modalback{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;padding:24px}
.modalcard{width:100%;max-width:340px;display:flex;flex-direction:column;gap:12px;padding:20px;border-radius:16px;background:var(--bg);box-shadow:var(--pop)}
.vinfo{position:relative;align-items:center;text-align:center;gap:0;padding:32px 24px}
.vinfo-x{position:absolute;top:8px;right:8px;color:var(--muted)}
.vinfo-ico{width:56px;height:56px;border-radius:16px;background:var(--sub);color:var(--ink);display:flex;align-items:center;justify-content:center}
.vinfo-t{margin-top:16px;font-size:18px;font-weight:700;letter-spacing:-.01em;color:var(--ink)}
.vinfo-b{margin-top:8px;font-size:15px;line-height:1.55;color:var(--text2);word-break:keep-all}
.vinfo .spkwave .wb{animation-duration:1.8s}.vinfo .spkwave .wb:nth-child(2){animation-delay:-1.2s}.vinfo .spkwave .wb:nth-child(3){animation-delay:-.6s}.vinfo .spkwave .wb:nth-child(4){animation-delay:-1.5s}.vinfo .spkwave .wb:nth-child(5){animation-delay:-.3s}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .vinfo{background:var(--sub)}:root:not([data-theme="light"]) .vinfo .vinfo-ico{background:var(--bg)}}
:root[data-theme="dark"] .vinfo{background:var(--sub)}:root[data-theme="dark"] .vinfo .vinfo-ico{background:var(--bg)}
.dlback{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;justify-content:flex-end;background:rgba(17,19,24,.45);animation:dlDimIn .24s ease-out}
.dlsheet{width:100%;max-width:440px;margin:0 auto;box-sizing:border-box;display:flex;flex-direction:column;padding:10px 20px calc(24px + env(safe-area-inset-bottom,0px));border-radius:22px 22px 0 0;background:var(--bg);color:var(--ink);animation:dlUp .34s cubic-bezier(.32,.72,0,1)}
.dldrag{display:flex;flex-direction:column;margin:-10px -20px 0;padding:10px 20px 0;touch-action:none;cursor:grab}
.dlhandle{align-self:center;width:40px;height:5px;border-radius:3px;background:var(--line);margin-bottom:14px}
.dlopt{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:54px;padding:0 4px;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--ink);text-align:left;font-family:inherit;cursor:pointer}
.dlopt.last{border-bottom:0}
.dlradio{flex:none;box-sizing:border-box;width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center}
.dlradio span{width:12px;height:12px;border-radius:50%;background:transparent}
.dlopt.on .dlradio{border-color:var(--accent)}
.dlopt.on .dlradio span{background:var(--accent)}
@keyframes dlUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes dlDown{from{transform:translateY(0)}to{transform:translateY(100%)}}
@keyframes dlDimIn{from{opacity:0}to{opacity:1}}
@keyframes dlDimOut{from{opacity:1}to{opacity:0}}
@media (prefers-reduced-motion: reduce){.dlback,.dlsheet,.dlback.closing,.dlback.closing .dlsheet{animation:none}}
.authwrap{min-height:100vh;min-height:100dvh;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:28px;padding:32px 24px}
.authlogo{display:flex;flex-direction:column;align-items:center;gap:10px}
.authlogo .logo{display:flex;align-items:center;gap:8px}
.authlogo .logo b{font-size:30px;font-weight:800;letter-spacing:-.03em}
.authlogo .logo i{font-style:normal;font-size:12px;font-weight:700;letter-spacing:.08em;padding:5px 8px;border-radius:6px;background:var(--accentSoft);color:var(--accent)}
.authlogo span{font-size:13px;color:var(--muted)}
.authcard{width:100%;max-width:340px;display:flex;flex-direction:column;gap:14px}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;height:50px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:15px;font-weight:600}
.divider{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--line)}
.authtabs{display:flex;gap:4px;padding:3px;border-radius:10px;background:var(--sub)}
.authtabs button{flex:1;height:38px;border:0;border-radius:8px;background:transparent;color:var(--muted);font-size:14px;font-weight:500}
.authtabs button.on{background:var(--segOn);color:var(--ink);font-weight:700;box-shadow:var(--shadow)}

</style>
</head>
<body>

<script>
(function(){
'use strict';
/* ---------- utils ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => (n < 10 ? '0' : '') + n;
const dstr = off => { const d = new Date(); d.setDate(d.getDate() + (off || 0)); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
const today = () => dstr(0);
const kor = d => { if (!d) return ''; const p = d.split('-'); return Number(p[1]) + '월 ' + Number(p[2]) + '일'; };
const md = d => { if (!d) return ''; const p = d.split('-'); return Number(p[1]) + '/' + Number(p[2]); };
const nkey = s => String(s || '').toLowerCase().trim().replace(/\s+/g, ' ');
let uidN = 0; const uid = () => Date.now().toString(36) + (++uidN).toString(36) + Math.random().toString(36).slice(2, 6);
const safeUrl = u => /^https?:\/\//i.test(u || '') ? u : '';
const ICONS = {
  moon:'<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  speaker:'<path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/>',
  download:'<path d="M12 4v11"/><path d="M7 10l5 5 5-5"/><path d="M5 20h14"/>',
  x:'<path d="M6 6l12 12M18 6L6 18"/>', plus:'<path d="M12 5v14M5 12h14"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>',
  repeat:'<path d="M17 2l3 3-3 3"/><path d="M4 11V9a4 4 0 0 1 4-4h12"/><path d="M7 22l-3-3 3-3"/><path d="M20 13v2a4 4 0 0 1-4 4H4"/>',
  chevUp:'<path d="M6 15l6-6 6 6"/>', chevDown:'<path d="M6 9l6 6 6-6"/>', chevLeft:'<path d="M15 6l-6 6 6 6"/>', chevRight:'<path d="M9 6l6 6-6 6"/>',
  edit:'<path d="M4 20h4L19 9l-4-4L4 16v4z"/>', trash:'<path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"/>',
  book:'<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2V5z"/><path d="M4 19a2 2 0 0 1 2-2h13"/><path d="M9 8h6"/>',
  pencil:'<path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/>',
  settings:'<path d="M4 7h9M17 7h3M4 12h3M11 12h9M4 17h11M19 17h1"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="17" r="2"/>',
  dots:'<circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/>',
  cal:'<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/>',
  info:'<circle cx="12" cy="12" r="9"/><path d="M12 8v5"/><circle cx="12" cy="16.3" r="0.9" fill="currentColor" stroke="none"/>'
};
const ic = (n, s) => '<svg width="' + (s || 20) + '" height="' + (s || 20) + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICONS[n] + '</svg>';

/* ---------- prefs (기기별) ---------- */
const PREF_KEY = 'day100.prefs';
let prefs = { theme: 'light', accent: 'US', slow: false };
try { Object.assign(prefs, JSON.parse(localStorage.getItem(PREF_KEY) || '{}')); } catch (e) {}
const savePrefs = () => { try { localStorage.setItem(PREF_KEY, JSON.stringify(prefs)); } catch (e) {} };

applyTheme();

/* ---------- Firebase ---------- */
const firebaseConfig = {
  apiKey: "AIzaSyDGELUi_VjLE6RV8YYzan0jpOatbJIpllM",
  authDomain: "day100-goal.firebaseapp.com",
  projectId: "day100-goal",
  storageBucket: "day100-goal.firebasestorage.app",
  messagingSenderId: "156091370807",
  appId: "1:156091370807:web:37e4c64a71b84258155eb2"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

/* ---------- state ---------- */
const newRow = () => ({ id: uid(), term: '', meaning: '', memo: '', open: false });
const blankForm = () => ({ date: today(), title: '', url: '', rows: [newRow()] });
const S = {
  sessions: [], tab: 'record', mode: 'video', q: '', sortBy: 'latest', sortOpen: false, abcShuffle: false, shuffleSeed: 1, logoutAsk: false, form: blankForm(), err: '', saving: false,
  inlineId: null, inlineForm: null, inlineErr: '', menuId: null, confirmDel: null, openKeys: {},
  calMonth: null, calSel: null, picker: null, pickerMonth: null,
  storeKind: 'db', localOnly: [], ready: false,
  user: null, authMode: 'signin', authEmail: '', authPw: '', authErr: '', authBusy: false, importing: false, voiceInfoOpen: false, pdfBusy: null, dlSort: 'latest'
};

/* ---------- storage (per-user Firestore) ---------- */
const norm = s => ({
  id: s.id, date: s.date || today(), title: s.title || '', url: s.url || '', createdAt: s.createdAt || 0,
  words: Array.isArray(s.words) ? s.words.map(w => ({ id: w.id || uid(), term: w.term || '', meaning: w.meaning || '', memo: w.memo || '' })) : []
});
let store = null;
let unsub = null;
function userCol() { return fdb.collection('users').doc(S.user.uid).collection('sessions'); }
function connectUser() {
  store = {
    async save(s) { const { id, ...body } = s; body.schemaVersion = 1; await userCol().doc(id).set(body); },
    async remove(id) { await userCol().doc(id).delete(); }
  };
  if (unsub) unsub();
  unsub = userCol().onSnapshot(snap => {
    const arr = [];
    snap.docs.forEach(d => { const v = d.data(); if (v) arr.push(norm(Object.assign({}, v, { id: d.id }))); });
    S.sessions = arr; S.ready = true;
    render();
  }, () => { S.ready = true; render(); });
}
function disconnectUser() { if (unsub) unsub(); unsub = null; store = null; S.sessions = []; S.ready = false; }

/* ---------- auth actions ---------- */
async function authGoogle() {
  S.authErr = ''; S.authBusy = true; renderAuth();
  try {
    const result = await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());
    if (result && result.additionalUserInfo && result.additionalUserInfo.isNewUser) toast('회원가입 완료!\nDAY100 GOAL에 오신 걸 환영해요');
  } catch (e) { S.authErr = authMsg(e); S.authBusy = false; renderAuth(); }
}
async function authEmailSubmit() {
  const email = S.authEmail.trim(), pw = S.authPw;
  if (!email || !pw) { S.authErr = '이메일과 비밀번호를 입력해 주세요'; renderAuth(); return; }
  if (pw.length < 6) { S.authErr = '비밀번호는 6자 이상이어야 해요'; renderAuth(); return; }
  S.authErr = ''; S.authBusy = true; renderAuth();
  try {
    if (S.authMode === 'signup') { await auth.createUserWithEmailAndPassword(email, pw); toast('회원가입 완료!\nDAY100 GOAL에 오신 걸 환영해요'); }
    else await auth.signInWithEmailAndPassword(email, pw);
  } catch (e) { S.authErr = authMsg(e); S.authBusy = false; renderAuth(); }
}
function authMsg(e) {
  const c = e && e.code || '';
  if (c === 'auth/email-already-in-use') return '이미 가입된 이메일이에요. 로그인해 주세요';
  if (c === 'auth/invalid-credential' || c === 'auth/wrong-password' || c === 'auth/user-not-found') return '이메일 또는 비밀번호가 맞지 않아요';
  if (c === 'auth/invalid-email') return '이메일 형식을 확인해 주세요';
  if (c === 'auth/popup-closed-by-user') return '로그인 창이 닫혔어요. 다시 시도해 주세요';
  if (c === 'auth/weak-password') return '비밀번호는 6자 이상이어야 해요';
  return '로그인하지 못했어요. 잠시 뒤 다시 시도해 주세요.';
}
function authSignOut() { auth.signOut(); }

/* ---------- import from backup JSON ---------- */
async function importBackup(file) {
  S.importing = true; render();
  try {
    const text = await file.text();
    const data = JSON.parse(text);
    const list = Array.isArray(data.sessions) ? data.sessions : [];
    let added = 0;
    for (const raw of list) {
      const s = norm(raw); if (!s.id) continue;
      const ref = userCol().doc(s.id);
      const snap = await ref.get();
      if (snap.exists) continue;
      const { id, ...body } = s; body.schemaVersion = 1;
      await ref.set(body); added++;
    }
    S.importing = false; render();
    toast(added ? '기록 ' + added + '개를 가져왔어요' : '새로 가져올 기록이 없어요');
  } catch (e) {
    S.importing = false; render();
    toast('가져오지 못했어요.\n파일을 확인해 주세요');
  }
}

/* ---------- speech ---------- */
/* ABC순 섞기 아이콘 출처: Lucide "shuffle" (ISC License, https://lucide.dev) */
const speechOK = typeof window.speechSynthesis !== 'undefined' && typeof window.SpeechSynthesisUtterance !== 'undefined';
/* 재생 중 표시: 누른 소리 버튼의 아이콘을 파형 막대로 바꾸고, 소리가 끝나면 원래 아이콘으로 */
const WAVE_SVG = n => '<svg class="spkwave" width="' + n + '" height="' + n + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path class="wb" d="M4 10v4"/><path class="wb" d="M8 7v10"/><path class="wb" d="M12 4v16"/><path class="wb" d="M16 7v10"/><path class="wb" d="M20 10v4"/></svg>';
const spk = { key: null, tok: 0, timer: null, started: 0 };
function spkKey(b) {
  if (!b) return null;
  if (b.id) return '#' + b.id;
  const same = Array.from(document.querySelectorAll('[data-a="say"]')).filter(x => x.dataset.v === b.dataset.v);
  return 'say|' + same.indexOf(b) + '|' + b.dataset.v;
}
function spkFind(key) {
  if (!key) return null;
  if (key[0] === '#') return document.getElementById(key.slice(1));
  const i = key.indexOf('|', 4), n = Number(key.slice(4, i)), v = key.slice(i + 1);
  return Array.from(document.querySelectorAll('[data-a="say"]')).filter(x => x.dataset.v === v)[n] || null;
}
function spkPaint(b, on) {
  const g = b && b.querySelector('svg'); if (!g) return;
  if (on === g.classList.contains('spkwave')) return;
  const n = Number(g.getAttribute('width')) || 20;
  g.outerHTML = on ? WAVE_SVG(n) : ic('speaker', n);
}
function spkStop(tok) {
  if (tok !== undefined && tok !== spk.tok) return;
  clearInterval(spk.timer); spk.timer = null;
  spkPaint(spkFind(spk.key), false); spk.key = null;
}
function speak(text, btn) {
  if (!speechOK || !text) return;
  spkStop();
  try {
    const ss = window.speechSynthesis; ss.cancel();
    const u = new SpeechSynthesisUtterance(text);
    const lang = prefs.accent === 'UK' ? 'en-GB' : 'en-US';
    u.lang = lang; u.rate = prefs.slow ? 0.7 : 1;
    const vs = ss.getVoices() || [];
    const nl = v => String(v.lang || '').replace('_', '-').toLowerCase();
    const v = vs.find(x => nl(x) === lang.toLowerCase()) || vs.find(x => nl(x).indexOf('en') === 0);
    if (v) u.voice = v;
    const tok = ++spk.tok;
    if (btn) {
      spk.key = spkKey(btn); spk.started = Date.now(); spkPaint(btn, true);
      u.onend = () => spkStop(tok); u.onerror = () => spkStop(tok);
      let idle = 0;
      spk.timer = setInterval(() => {
        if (tok !== spk.tok) return;
        if (ss.speaking || ss.pending) { idle = 0; spkPaint(spkFind(spk.key), true); return; }
        if (Date.now() - spk.started > 1500 && ++idle >= 2) spkStop(tok);
      }, 200);
    }
    ss.speak(u);
  } catch (e) { spkStop(); }
}
if (speechOK) { try { window.speechSynthesis.getVoices(); } catch (e) {} }

/* ---------- toast ---------- */
function scrollToBlock(id) {
  requestAnimationFrame(() => {
    const el = document.getElementById('block-' + id);
    /* 아이폰 상단(시계·노치) 가림막 높이만큼 더 내려서 콘텐츠 제목이 가려지지 않게 */
    const safe = parseFloat(getComputedStyle(document.body, '::before').height) || 0;
    if (el) { const y = el.getBoundingClientRect().top + window.scrollY - safe - 12; window.scrollTo({ top: Math.max(0, y), behavior: 'auto' }); }
  });
}
/* 콘텐츠를 지운 뒤: 바로 아래 콘텐츠가 지운 콘텐츠 자리로 올라오게 하고(제목이 가려져 있었다면 화면 맨 위 바로 아래로),
   마지막 콘텐츠를 지웠다면 바로 위 콘텐츠의 제목이 가려졌을 때만 보이게 옮김. 기록 저장·삭제 코드는 건드리지 않음 */
function delNeighbor(id) {
  const blocks = Array.from(document.querySelectorAll('.block[id^="block-"]'));
  const i = blocks.findIndex(b => b.id === 'block-' + id); if (i < 0) return null;
  const nb = blocks[i + 1] || blocks[i - 1]; if (!nb) return null;
  return { id: nb.id.slice(6), next: !!blocks[i + 1], top: blocks[i].getBoundingClientRect().top };
}
function delShowTitle(nb) {
  requestAnimationFrame(() => {
    const el = document.getElementById('block-' + nb.id); if (!el) return;
    const safe = parseFloat(getComputedStyle(document.body, '::before').height) || 0;
    const top = el.getBoundingClientRect().top, min = safe + 12;
    const want = nb.next ? Math.max(nb.top, min) : (top < min ? min : top);
    if (Math.abs(top - want) > 1) window.scrollTo({ top: Math.max(0, window.scrollY + top - want), behavior: 'auto' });
  });
}
let toastT = null;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600); }

/* ---------- derived ---------- */
function derive() {
  const T = today();
  const dates = {}; let total = 0, todayW = 0;
  S.sessions.forEach(s => { dates[s.date] = true; total += s.words.length; if (s.date === T) todayW += s.words.length; });
  const chron = S.sessions.slice().sort((a, b) => a.date.localeCompare(b.date) || (a.createdAt || 0) - (b.createdAt || 0));
  const seen = {}, nthOf = {}, byKey = {};
  chron.forEach(s => s.words.forEach(w => {
    const k = nkey(w.term); if (!k) return;
    seen[k] = (seen[k] || 0) + 1; nthOf[w.id] = seen[k];
    (byKey[k] = byKey[k] || []).push({ w, s });
  }));
  return { T, dates, count: Object.keys(dates).length, total, todayW, nthOf, byKey };
}
let D = derive();

/* ---------- render: tab bar ---------- */
function renderTabs() {
  const tabs = [['record', 'pencil', '기록'], ['words', 'book', '단어장'], ['settings', 'settings', '설정']];
  tabs.forEach(([k, icn, label]) => {
    const b = $('#t-' + k);

  if (!last) return '<div id="dup-' + ctx + '-' + row.id + '"></div>';
  return '<div id="dup-' + ctx + '-' + row.id + '"><div class="dup"><span class="ic">' + ic('repeat', 16) + '</span><div class="col" style="gap:4px">' +
    '<b>이미 ' + prior.length + '번 만난 단어예요</b>' +
    '<span>' + esc(kor(last.s.date)) + '  ' + esc(last.s.title) + '</span>' +
    '<span>지난 뜻: ' + esc(last.w.meaning || '뜻 없음') + '</span></div></div></div>';
}
function rowHTML(r, ctx, excludeId) {
  const a = 'data-ctx="' + ctx + '" data-row="' + r.id + '"';
  return '<div class="wrow">' +
    '<div class="row" style="gap:4px">' +
      '<input class="inp term" type="text" aria-label="단어 또는 표현" placeholder="단어 / 표현" autocomplete="off" autocapitalize="off" spellcheck="false" value="' + esc(r.term) + '" data-f="term" ' + a + '>' +
      (speechOK ? '<button type="button" class="ib" data-a="speakRow" ' + a + ' aria-label="단어 발음 듣기"' + (r.term.trim() ? '' : ' disabled') + ' id="spk-' + ctx + '-' + r.id + '">' + ic('speaker') + '</button>' : '') +
      '<button type="button" class="ib rm" data-a="rmRow" ' + a + ' aria-label="이 단어 지우기">' + ic('x') + '</button>' +
    '</div>' +
    dupHTML(r, ctx, excludeId) +
    '<input class="inp" type="text" aria-label="뜻" placeholder="뜻" autocomplete="off" value="' + esc(r.meaning) + '" data-f="meaning" ' + a + '>' +
    (r.open ? '<div class="row" style="gap:4px"><input class="inp" style="font-size:15px;color:var(--text2)" type="text" aria-label="예문이나 메모" placeholder="예문이나 메모" autocomplete="off" autocapitalize="off" spellcheck="false" value="' + esc(r.memo) + '" data-f="memo" ' + a + '>' +
      (speechOK ? '<button type="button" class="ib" style="color:' + (r.memo.trim() ? 'var(--ink)' : 'var(--muted)') + '" data-a="speakMemo" ' + a + ' aria-label="예문 발음 듣기"' + (r.memo.trim() ? '' : ' disabled') + ' id="memospk-' + ctx + '-' + r.id + '">' + ic('speaker') + '</button>' : '') + '</div>' : '') +
    '<button type="button" class="toggle" data-a="toggleMemo" ' + a + ' aria-expanded="' + (r.open ? 'true' : 'false') + '">' +
      (r.open ? ic('chevUp', 15) + '<span>예문·메모 접기</span>' : r.memo.trim() ? ic('chevDown', 15) + '<span>예문·메모 펼치기</span>' : ic('plus', 15) + '<span>예문·메모</span>') + '</button>' +
  '</div>';
}
function pickerHTML(ctx, curDate) {
  const T = D.T;
  const pm0 = S.pickerMonth || (curDate || T).slice(0, 7);
  const y = Number(pm0.slice(0, 4)), m = Number(pm0.slice(5, 7));
  const first = new Date(y, m - 1, 1).getDay(), dim = new Date(y, m, 0).getDate();
  let cells = '';
  for (let i = 0; i < first; i++) cells += '<div class="pday"></div>';
  for (let d = 1; d <= dim; d++) {
    const ds = y + '-' + pad(m) + '-' + pad(d);
    const fut = ds > T, sel = ds === curDate, isT = ds === T, has = !!D.dates[ds];
    cells += '<div class="pday"><button type="button" data-a="pick" data-ctx="' + ctx + '" data-v="' + ds + '" class="' + (sel ? 'sel' : (isT ? 't' : '')) + '"' + (fut ? ' disabled' : '') + ' aria-label="' + m + '월 ' + d + '일' + (has ? ', 공부한 날' : '') + '">' + d + '</button><i class="' + (has && !sel ? 'has' : '') + '"></i></div>';
  }
  return '<div class="picker" data-keep="picker">' +
    '<div class="row between"><button type="button" class="ibs" data-a="pkMonth" data-v="-1" aria-label="이전 달">' + ic('chevLeft', 18) + '</button>' +
    '<span style="font-size:15px;font-weight:700">' + y + '년 ' + m + '월</span>' +

    '<div class="pfoot"><span><i></i>공부한 날</span><button type="button" data-a="pick" data-ctx="' + ctx + '" data-v="' + T + '">오늘</button></div>' +
  '</div>';
}
function chipHTML(ctx, date) {

function shuffledKeys(keys, seed) {
  const a = keys.slice(); let t = seed | 0;
  const rnd = () => { t = (t + 0x6D2B79F5) | 0; let r = Math.imul(t ^ (t >>> 15), t | 1); r ^= r + Math.imul(r ^ (r >>> 7), r | 61); return ((r ^ (r >>> 14)) >>> 0) / 4294967296; };
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); const x = a[i]; a[i] = a[j]; a[j] = x; }
  return a;
}
function listHTML() {
  const q = S.q.trim().toLowerCase();
  if (S.mode === 'video') {
    const sorted = S.sessions.slice().sort((a, b) => S.sortBy === 'oldest' ? (a.date.localeCompare(b.date) || (a.createdAt || 0) - (b.createdAt || 0)) : S.sortBy === 'alpha' ? (a.title || '').localeCompare(b.title || '', 'en', { sensitivity: 'base' }) : (b.date.localeCompare(a.date) || (b.createdAt || 0) - (a.createdAt || 0)));
    let h = '';

      const ws = s.words.filter(w => match(w, q));
      if (q && !ws.length && S.inlineId !== s.id) return;
      h += blockHTML(s, ws);
    });
    if (!h) return '<div class="pad" style="padding-top:40px;text-align:center;font-size:15px;color:var(--muted)">‘' + esc(S.q) + '’에 맞는 단어가 없어요</div>';

  }

    let shown = 0;
    keys.forEach(k => {
      const all = D.byKey[k].slice().reverse();
      if (q && !all.some(x => match(x.w, q))) return;
      shown++;
      const first = all[0].w.term.trim()[0] || '';
      const L = /[a-z]/i.test(first) ? first.toUpperCase() : '#';
      if (!shuf && L !== cur) { flush(); cur = L; }
      const latest = all.find(x => x.w.meaning) || all[0];

      else it += '<span class="wterm">' + esc(all[0].w.term) + '</span>';
      it += (speechOK ? '<button type="button" class="ibs spk" data-a="say" data-v="' + esc(all[0].w.term) + '" aria-label="단어 발음 듣기">' + ic('speaker', 18) + '</button>' : '') + '</div>';
      it += '<span class="wmean">' + esc(latest.w.meaning || '뜻 없음') + '</span>';
      if (n === 1) it += '<div class="src"><span>' + md(all[0].s.date) + '</span><span>' + esc(all[0].s.title) + '</span></div>';
      if (open) {
        it += '<div class="entries">' + all.map(x => '<div class="entry"><div class="row" style="gap:8px;align-items:baseline"><span style="font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap">' + md(x.s.date) + '</span><span style="font-size:13px;font-weight:500;color:var(--text2)">' + esc(x.s.title) + '</span></div>' +

    const distinct = Object.keys(D.byKey).length;
    return '<div class="col pad"><div class="row between" style="height:20px;margin-top:8px;margin-bottom:4px;padding-left:6px"><span style="font-size:14px;color:var(--text2)">서로 다른 단어 <b style="color:var(--ink)">' + distinct + '</b>개</span>' +
      (shuf ? '<button type="button" data-a="exitShuffle" style="position:relative;z-index:1;box-sizing:border-box;display:flex;align-items:center;gap:2px;min-height:36px;padding:8px 0 8px 10px;border:0;background:transparent;cursor:pointer;font-family:inherit;font-size:13px;font-weight:600;color:var(--accent)">알파벳순으로<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>' : '') +
      '</div>' + h + '</div>';

  // 달력
  const all = Object.keys(D.dates).sort();
  const latest = all.length ? all[all.length - 1] : D.T;

  '</div>';

function dlBindDrag(w) {

});
document.addEventListener('keydown', e => {
  const t = e.target;
  if (e.key === 'Enter' && t.dataset && t.dataset.af === 'pw' && !S.authBusy) { e.preventDefault(); authEmailSubmit(); return; }
  if (e.key === 'Enter' && t.dataset && t.dataset.f === 'meaning' && !e.isComposing && e.keyCode !== 229) {
    e.preventDefault(); const ctx = t.dataset.ctx, form = formOf(ctx); const r = newRow(); form.rows.push(r); rerender(ctx); focusRow(ctx, r.id);
  }
  if (e.key === 'Escape' && (S.picker || S.menuId || S.voiceInfoOpen || S.sortOpen)) { S.picker = null; S.menuId = null; S.voiceInfoOpen = false; S.sortOpen = false; render(); }
});

document.addEventListener('gesturestart', e => e.preventDefault());
let lastTouchEnd = 0;
document.addEventListener('touchend', e => { const now = Date.now(); if (now - lastTouchEnd <= 300) e.preventDefault(); lastTouchEnd = now; }, { passive: false });

try { history.scrollRestoration = 'manual'; } catch (e) {}
let scrollLockUntil = 0, userActed = false;
['touchstart', 'wheel', 'mousedown', 'keydown'].forEach(ev => document.addEventListener(ev, () => { userActed = true; }, { passive: true, capture: true }));
window.addEventListener('scroll', () => { if (!userActed && Date.now() < scrollLockUntil && window.scrollY > 0) window.scrollTo(0, 0); }, { passive: true });
/* 설정에서 PDF·백업을 받고 (파일 보기·저장 화면에) 다녀왔을 때 화면이 저절로 맨 위로 가 있으면, 누르기 직전 위치로 되돌림.
   - 앱을 떠날 때의 위치가 누르기 직전 위치와 같을 때만, 돌아온 직후 잠깐(1.5초) 동안만 되돌림
   - 사용자가 화면을 직접 만지거나, 설정 탭이 아니거나, 10분이 지나면 아무것도 하지 않음 (탭 이동·로그인 때 맨 위로 가는 동작은 그대로) */
let dlKeep = null;
function dlKeepArm() { dlKeep = S.tab === 'settings' ? { y: window.scrollY, until: Date.now() + 600000, leftY: null, watch: 0 } : null; }
function dlKeepValid() {
  if (dlKeep && (Date.now() > dlKeep.until || !S.user || S.tab !== 'settings')) dlKeep = null;
  return !!dlKeep;
}
function dlKeepLeave() { if (dlKeepValid() && dlKeep.leftY === null) dlKeep.leftY = window.scrollY; }
function dlKeepFix() {
  if (!dlKeepValid() || Date.now() > dlKeep.watch) return;
  if (window.scrollY < dlKeep.y - 40) window.scrollTo(0, dlKeep.y);
}
function dlKeepBack() {
  if (!dlKeepValid() || dlKeep.leftY === null) return;
  if (Math.abs(dlKeep.leftY - dlKeep.y) > 40) { dlKeep = null; return; }
  dlKeep.watch = Date.now() + 1500;
  dlKeepFix(); requestAnimationFrame(dlKeepFix); setTimeout(dlKeepFix, 200); setTimeout(dlKeepFix, 600);
  setTimeout(() => { if (dlKeep && Date.now() > dlKeep.watch) dlKeep = null; }, 1600);
}
['touchstart', 'wheel', 'mousedown', 'keydown'].forEach(ev => document.addEventListener(ev, () => { dlKeep = null; }, { passive: true, capture: true }));
window.addEventListener('scroll', dlKeepFix, { passive: true });
window.addEventListener('blur', dlKeepLeave);
window.addEventListener('pagehide', dlKeepLeave);
window.addEventListener('pageshow', dlKeepBack);
window.addEventListener('focus', dlKeepBack);
document.addEventListener('visibilitychange', () => { if (document.hidden) dlKeepLeave(); else dlKeepBack(); });

render();
auth.onAuthStateChanged(u => {
  if (u) { S.user = u; S.authBusy = false; S.authErr = ''; S.tab = 'record'; S.mode = 'video'; S.q = ''; S.sortBy = 'latest'; S.sortOpen = false; S.abcShuffle = false; S.logoutAsk = false; S.openKeys = {}; S.calSel = null; S.calMonth = null; S.menuId = null; S.confirmDel = null; S.inlineId = null; S.inlineForm = null; S.picker = null; if (document.activeElement && document.activeElement.blur) document.activeElement.blur(); connectUser(); }
  else { S.user = null; disconnectUser(); S.authBusy = false; S.authErr = ''; S.authMode = 'signin'; }
  render();
  resetScroll();
});

/* 로그인·로그아웃으로 화면이 바뀌면 맨 위에서 시작. 직후 2초간은 사용자가 직접 만지기 전까지 밀려 내려가도 다시 맨 위로 */
function resetScroll() {
  userActed = false; scrollLockUntil = Date.now() + 2000;
  const go = () => { if (userActed) return; window.scrollTo(0, 0); document.documentElement.scrollTop = 0; document.body.scrollTop = 0; };
  go(); requestAnimationFrame(go); setTimeout(go, 200);
}
})();
</script>
</body>
